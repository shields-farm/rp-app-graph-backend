# Tailnet access to the GraphQL gateway: https://rp-graph.<tailnet>.ts.net
#
# Modelled on whiteboard/tailnet-ingress.yaml in shields-farm/kubernetes —
# that is the proven shape in this cluster. An earlier revision of this file
# used a `type: LoadBalancer / loadBalancerClass: tailscale` Service plus an
# empty ProxyGroup CR; that got a tailnet IP and MagicDNS name but never
# forwarded to the backend (proxy alive, port refused), because that is not
# how the operator wires ingress here. Keep this Ingress shape.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rp-app-graph-backend
  namespace: rp-app-graph-backend
  annotations:
    # Route through the shared HA ProxyGroup rather than a single-replica
    # proxy pod (same as whiteboard/honcho/argocd).
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  # tls.hosts sets the desired MagicDNS name; the operator provisions the cert.
  tls:
    - hosts:
        - rp-graph
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rp-app-graph-backend
                port:
                  name: http
