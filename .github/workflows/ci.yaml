# CI: build + test + lint. Image build/push happens on merge to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  gqlgen-check:
    # Verify the generated code is in sync with the schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run github.com/99designs/gqlgen generate
      - run: git diff --exit-code -- graph/generated.go graph/model/models_gen.go

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rp-app-graph-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
