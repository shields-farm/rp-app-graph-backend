# CI: build + test + lint on every PR. On merge to main, also build and push
# the container image to ghcr.io — the cluster pulls from there, so this job
# IS the artifact pipeline; nothing builds images on a developer machine.
#
# Security: no ${{ github.event.* }} fields are interpolated into run: or ref:
# anywhere in this workflow. github.sha and github.actor are GitHub-generated,
# not attacker-controlled.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  gqlgen-check:
    # Verify the generated code is in sync with the schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go tool gqlgen generate
      - name: Generated code is in sync
        run: |
          set -euo pipefail
          # gqlgen merges hand-written resolver bodies in schema.resolvers.go,
          # so regen must be a no-op across all three generated/merged files.
          if git status --short -- graph/generated.go graph/model/models_gen.go graph/schema.resolvers.go | grep .; then
            echo "gqlgen output drifted from schema — run 'go tool gqlgen generate' locally and commit"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rp-app-graph-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    # Push the image only from main, only after tests pass.
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/shields-farm/rp-app-graph-backend:latest
            ghcr.io/shields-farm/rp-app-graph-backend:${{ github.sha }}
          # Both amd64 (x86 Macs, RPis, x86 servers) and arm64 (Apple Silicon,
          # recent ARM). The cluster is mixed; publish both.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
